[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers --tb=short
asyncio_mode = auto
markers =
    unit: pure-logic tests, no external services
    integration: requires a live PostgreSQL (set TEST_DATABASE_URL)
    security: authorization, injection and data-access tests
    failure: fault-injection tests
    contract: MCP tool contract tests
    slow: long-running
filterwarnings =
    ignore::DeprecationWarning
